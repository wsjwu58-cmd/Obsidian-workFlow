name: 每日巡检

on:
  schedule:
    - cron: '30 0 * * *'      # 每天 08:30（UTC+8）= 00:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行巡检
        run: python scripts/lint.py --log expand/log.md

      - name: 提交巡检报告（PR，main 受保护不可直推）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变更，跳过"
            exit 0
          fi
          BRANCH="lint/$(date +%Y%m%d)"
          git config user.name "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add expand/log.md
          git commit -m "lint: $(date +%F) 巡检报告" || { echo "无有效提交"; exit 0; }
          git push -u origin "$BRANCH" --force-with-lease
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "已有同分支 open PR，跳过创建"
            exit 0
          fi
          if gh pr create --base main --head "$BRANCH" \
              --title "lint: $(date +%F) 巡检报告" \
              --body "每日巡检自动写入 expand/log.md。main 受保护，经 PR 合入。"; then
            exit 0
          fi
          echo "::warning::无法用 GITHUB_TOKEN 开 PR（Settings → Actions → General → 勾选 Allow GitHub Actions to create and approve pull requests）。分支已推送：origin/$BRANCH"
          echo "手动开 PR：${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"
          exit 0

      - name: 严重问题开 Issue
        if: hashFiles('.lint-issues.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s .lint-issues.md ]; then
            gh issue create --title "巡检异常 $(date +%F)" --body-file .lint-issues.md
          fi
