# 调度中枢（已退役）
#
# 2026-08-10：不再每 3 小时轮询。research.yml 在情报搜索结束后
# 直接一次性跑 curate.py --limit 0 处理全部待处理。
#
# 手动补跑全量 curate：
#   SSH → cd /root/note-worker && python3 scripts/curate.py --limit 0

name: 调度中枢（已退役）

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 提示退役
        run: |
          echo "dispatch-worker.yml 已退役。"
          echo "请使用 research.yml（Research → 全量 Curate），或服务器手动："
          echo "  python3 scripts/curate.py --limit 0"
          exit 0
