# 收录落位（Finalize）— 已退役
#
# 2026-08-10：落位已内联到 scripts/curate.py，整条流水线只开一次人工终审 PR。
# 本 workflow 不再触发，避免第二次「收录 PR」。
#
# 手动补跑旧批次：python scripts/finalize.py --batch <name>

name: 收录落位（已退役）

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: 提示退役
        run: |
          echo "finalize.yml 已退役。落位由 curate.py 在唯一终审 PR 内完成。"
          exit 0
