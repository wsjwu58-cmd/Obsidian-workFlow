name: AI 加工（六维 Ingest）

on:
  schedule:
    - cron: '0 0 * * *'      # 每天 08:00（UTC+8）= 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查待处理素材
        id: pending
        run: echo "count=$(python scripts/count_pending.py)" >> "$GITHUB_OUTPUT"

      - name: 执行六维加工
        if: steps.pending.outputs.count != '0'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          BING_SEARCH_API_KEY: ${{ secrets.BING_SEARCH_API_KEY }}
          BING_SEARCH_ENDPOINT: ${{ secrets.BING_SEARCH_ENDPOINT }}
        run: python scripts/ingest.py

      - name: 提交并创建 PR（人工审阅闭环）
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ai-ingest/$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add expand/ raw/
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "kb-bot"
            git config user.email "kb-bot@users.noreply.github.com"
            git commit -m "ingest: $(date +%F) 六维加工结果"
            git push -u origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "AI 加工 $(date +%F)" \
              --body "六维加工自动生成，请 review 后合并。变更摘要见 wiki/log.md。"
          fi
